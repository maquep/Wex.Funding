services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wex_funding
      POSTGRES_USER: wex
      POSTGRES_PASSWORD: wex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wex -d wex_funding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
